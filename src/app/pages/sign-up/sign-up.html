<form>
  <h1>Sign Up</h1>

  <input type="text" [formField]="signUpForm.name" placeholder="Name">
  <input type="text" [formField]="signUpForm.username" placeholder="Username">
  <input type="email" [formField]="signUpForm.email" placeholder="Email">
  <input type="password" [formField]="signUpForm.password" placeholder="Password">

  <button type="submit" (click)="handleSignUp($event)" [disabled]="signUpForm().invalid() || isCreating()">Sign Up</button>
</form>
